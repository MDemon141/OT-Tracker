var h='<div class="top"><div><h1>Phiếu lương</h1><div class="mu">Tháng '+vm+'/'+vy+'</div></div><div class="nv"><button class="ic" aria-label="Tháng trước" onclick="nav(-1)">‹</button><button class="pill" onclick="vy=T.getFullYear();vm=T.getMonth()+1;render()">Hôm nay</button><button class="ic" aria-label="Tháng sau" onclick="nav(1)">›</button></div></div>';
h+='<div class="row"><button class="pri" style="flex:1" onclick="openInput()">✎ Nhập thông số</button><button style="flex:1" onclick="openOvr()">Sửa tổng</button></div>';
if(!s.lcb)h+='<div class="card mu" style="text-align:center">Chưa có lương cơ bản. Bấm “Nhập thông số” để bắt đầu.</div>';
h+='<div class="slip an" style="--dx:'+dir*24+'px"><div class="sh"><div class="t1">PHIẾU LƯƠNG</div><div class="t2">Tháng '+vm+' / '+vy+'</div><div class="inf"><div><small>Công chuẩn</small><b>'+fmt(s.w)+'</b></div><div><small>Đi làm</small><b>'+fmt(s.days)+'</b></div><div><small>Ăn trưa</small><b>'+(s.eat?'Có':'Không')+'</b></div><div><small>Giờ OT</small><b>'+fmt(o.h15+o.h2)+'</b></div></div></div>'
+'<div class="sec">I. Lương &amp; thưởng</div>'
+ln('Lương cơ bản','',s.lcb)+ln('Thưởng','',s.bonus)+ln('Thưởng chất lượng','',s.qual)+ln('Thưởng thâm niên','',s.senior)
+ln('Thưởng hiệu suất','OT x'+fmt(ST.f2)+': '+fmt(o.h2)+'h × '+fmt(ST.f2)+' × '+fN(s.hr)+'/giờ',v.perf,ov.perf)
+'<div class="sec">II. Phụ cấp</div>'
+ln('Phụ cấp ăn ca',s.eat?'Ăn tại CT: '+fN(ST.mealEat)+' × '+fmt(s.days)+' công':fN(ST.meal)+' ÷ '+s.std+' × '+fmt(s.days)+' công',v.meal,ov.meal)
+ln('Phụ cấp nhà trọ',fN(ST.lodge)+' ÷ '+s.std+' × '+fmt(s.w)+' công',v.lodge,ov.lodge)
+ln('Phụ cấp đi lại',fN(ST.travel)+' ÷ '+s.std+' × '+fmt(s.w)+' công',v.travel,ov.travel)
+ln('Phụ cấp con nhỏ','',s.child)+ln('Chuyên cần','',v.att,ov.att)
+'<div class="sec">III. Tăng ca</div>'
+ln('Tiền tăng ca','('+fmt(o.h15)+'h × '+fmt(ST.f1)+' + '+fmt(o.h2)+'h × '+fmt(ST.f2)+') × '+fN(s.lcb)+' ÷ '+s.div+' ÷ 8',v.ot,ov.ot)
+sumr('TỔNG THU NHẬP',s.gross,'in')
+'<div class="sec">IV. Khoản trừ</div>'
+ln('BHXH ('+fmt(ST.rBhxh)+'%)','('+fN(s.lcb)+' + '+fN(ST.bhBase)+') × '+fmt(ST.rBhxh)+'%',v.bhxh,ov.bhxh)
+ln('Công đoàn ('+fmt(ST.rUnion)+'%)','('+fN(s.lcb)+' + '+fN(ST.bhBase)+') × '+fmt(ST.rUnion)+'%',v.union,ov.union)
+sumr('TỔNG KHOẢN TRỪ',s.ded,'de')
+'<div class="net"><div><small>THỰC LĨNH</small><div class="fm">Thu nhập − Khoản trừ</div></div><b>'+fK(s.net)+'</b></div>'
+'<div class="ft">Đơn vị: đồng</div></div>';
return h}
function showSheet(x){var s=document.getElementById('sheet');s.innerHTML='<div>'+x+'</div>';s.className='show'}
function fld(id,l,val,ph){return '<label class="sw">'+l+'<input id="'+id+'" type="text" inputmode="decimal" value="'+(val==null?'':val)+'" placeholder="'+(ph==null?'':ph)+'" style="width:120px;text-align:right"></label>'}
var IF=[['lcb','Lương cơ bản'],['bonus','Thưởng'],['qual','Thưởng chất lượng'],['senior','Thưởng thâm niên'],['child','Phụ cấp con nhỏ']];
function openInput(){var P=PY[ym(vy,vm)]||{},inh=lcbOf(vy,vm),x='<h3 style="margin:0">Thông số tháng '+vm+'/'+vy+'</h3><div class="mu" style="margin-bottom:6px">Nhập theo nghìn đồng: 500 = 500.000 đ. Các khoản còn lại (ăn ca, nhà trọ, BH…) chỉnh ở Cài đặt.</div>';
IF.forEach(function(f){x+=fld('i_'+f[0],f[1],P[f[0]],f[0]=='lcb'?(inh||'vd 8000'):'0')});
x+='<div class="mu">Lương cơ bản để trống sẽ lấy theo tháng gần nhất hoặc thông tin mốc đã nhập.</div><button class="pri full" onclick="saveInput()">Lưu</button><div class="q" style="margin-top:8px"><button onclick="copyDef()">Chép từ mốc cài đặt</button><button onclick="closeS()">Đóng</button></div>';showSheet(x)}
function saveInput(){var P=pyGet(vy,vm);IF.forEach(function(f){var v=num(document.getElementById('i_'+f[0]).value);if(v==null)delete P[f[0]];else P[f[0]]=v});sv('py',PY);closeS();render(1);toast('Đã lưu')}
function copyDef(){var D=ST.def;if(!D||!Object.keys(D).length){toast('Chưa nhập thông tin mốc ở Cài đặt');return}IF.forEach(function(f){var e=document.getElementById('i_'+f[0]);if(e&&D[f[0]]!=null)e.value=D[f[0]]});toast('Đã chép từ mốc, bấm Lưu')}
function openOvr(){var s=slip(vy,vm),O=s.P.ovr||{},x='<h3 style="margin:0">Sửa tổng tháng '+vm+'/'+vy+'</h3><div class="mu" style="margin-bottom:6px">Nhập tay để thay giá trị tự tính (nghìn đồng). Để trống = tự động; số mờ là giá trị tự tính.</div>';
OVF.forEach(function(f){x+=fld('o_'+f[0],f[1],O[f[0]],Math.round(s.a[f[0]]*100)/100)});
x+='<button class="pri full" onclick="saveOvr()">Lưu</button><div class="q" style="margin-top:8px"><button onclick="resetOvr()">Về tự động</button><button onclick="closeS()">Đóng</button></div>';showSheet(x)}
function saveOvr(){var P=pyGet(vy,vm),O={},n=0;OVF.forEach(function(f){var v=num(document.getElementById('o_'+f[0]).value);if(v!=null){O[f[0]]=v;n++}});if(n)P.ovr=O;else delete P.ovr;sv('py',PY);closeS();render(1);toast('Đã lưu')}
function resetOvr(){delete pyGet(vy,vm).ovr;sv('py',PY);render(1);toast('Đã về tự động')}
function settPay(){var D=ST.def||{},x='<div class="card"><div style="font-weight:700;margin-bottom:2px">Thông tin mốc (mặc định phiếu lương)</div><div class="mu">Nhập theo nghìn đồng: 500 = 500.000 đ. Dùng để sao chép nhanh ở mục Nhập thông số.</div>';
IF.forEach(function(f){x+=fld('d_'+f[0],f[1],D[f[0]],f[0]=='lcb'?'vd 8000':'0')});
x+='</div><div class="card"><div style="font-weight:700;margin-bottom:2px">Lương &amp; phụ cấp (dùng chung các tháng)</div><div class="mu">Nhập theo nghìn đồng: 650 = 650.000 đ.</div>';
PF.forEach(function(p){x+=fld('s_'+p[0],p[1],ST[p[0]])});
return x+'</div>'}

document.getElementById('sheet').onclick=function(e){if(e.target==this)closeS()};
theme();render();
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script></body></html>
